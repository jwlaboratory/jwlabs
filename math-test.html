<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>math render test</title>
  <link rel="stylesheet" href="/vendor/katex-0.18.2/katex.min.css" />
  <style>
    body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 24px; font-size: 15px; line-height: 1.5; }
    h2 { font-size: 15px; margin: 20px 0 6px; }
    .box { border: 1px solid #ddd; padding: 8px; }
    .wrapB { overflow-x: auto; }
    .wrapC { overflow-x: auto; }
    .wrapC .katex-display > .katex { width: max-content; max-width: none; margin: 0 auto; }
    .wrapD { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-color: #d6d6d6 transparent; scrollbar-width: thin; }
    .wrapD .katex-display { margin: 0; padding: 4px 0 8px; }
    .wrapD .katex-display > .katex { width: max-content; max-width: none; margin: 0 auto; }
    .wrapE { overflow-x: clip; }
    .wrapE .katex-display > .katex { width: max-content; max-width: none; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="zoominfo"></div>

  <h2>A control: bare div</h2>
  <div class="box"><div class="m"></div></div>

  <h2>B overflow-x:auto wrapper</h2>
  <div class="box"><div class="m wrapB"></div></div>

  <h2>C overflow-x:auto + width:max-content</h2>
  <div class="box"><div class="m wrapC"></div></div>

  <h2>D full article recipe</h2>
  <div class="box"><div class="m wrapD"></div></div>

  <h2>E overflow-x:clip + max-content</h2>
  <div class="box"><div class="m wrapE"></div></div>

  <script>
    document.getElementById("zoominfo").textContent =
      `dpr=${window.devicePixelRatio} innerW=${window.innerWidth} outerW=${window.outerWidth}`;
  </script>
  <script src="/vendor/katex-0.18.2/katex.min.js"></script>
  <script>
    document.querySelectorAll(".m").forEach((el) => {
      katex.render(
        "\\begin{aligned}" +
        "\\mathbb{E}\\big[\\text{accepted} \\mid \\text{tree}\\big]" +
        "&= \\sum_{u \\in T} \\prod_{v \\in \\mathrm{path}(u)} q(v) \\\\" +
        "&= 0.55 + 0.40 + 0.44 + 0.34 \\\\" +
        "&= \\mathbf{1.73}" +
        "\\end{aligned}",
        el,
        { displayMode: true, output: "html", throwOnError: false },
      );
    });
  </script>
</body>
</html>
