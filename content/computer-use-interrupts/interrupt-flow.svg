<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">A tiny watcher interrupts the main computer-use model</title>
  <desc id="desc">The main model hands waiting off to a small local watcher. The watcher rapidly checks the screen and wakes the main model as soon as the page is ready.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2; rx: 14; }
      .watcher { fill: #f1faf6; stroke: #178a59; stroke-width: 3; rx: 14; }
      .label { font: 600 24px Helvetica, Arial, sans-serif; fill: #1a1a1a; text-anchor: middle; }
      .sub { font: 18px Helvetica, Arial, sans-serif; fill: #666; text-anchor: middle; }
      .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; marker-end: url(#arrow); }
      .pulse { fill: #178a59; }
    </style>
  </defs>
  <rect width="1200" height="410" fill="#fafafa"/>
  <rect class="box" x="70" y="115" width="300" height="150"/>
  <text class="label" x="220" y="168">Main model</text>
  <text class="sub" x="220" y="202">encounters a page</text>
  <text class="sub" x="220" y="228">that requires waiting</text>
  <rect class="watcher" x="450" y="100" width="300" height="180"/>
  <text class="label" x="600" y="154">Tiny local watcher</text>
  <text class="sub" x="600" y="190">checks loaded / pending</text>
  <text class="sub" x="600" y="218">in a fast, cheap loop</text>
  <circle class="pulse" cx="546" cy="250" r="6"/>
  <circle class="pulse" cx="572" cy="250" r="6" opacity=".72"/>
  <circle class="pulse" cx="598" cy="250" r="6" opacity=".5"/>
  <circle class="pulse" cx="624" cy="250" r="6" opacity=".3"/>
  <rect class="box" x="830" y="115" width="300" height="150"/>
  <text class="label" x="980" y="168">Page is ready</text>
  <text class="sub" x="980" y="202">wake the main model</text>
  <text class="sub" x="980" y="228">with one interrupt</text>
  <path class="line" d="M370 190 H444"/>
  <path class="line" d="M750 190 H824"/>
  <path class="line" d="M980 270 V345 H220 V271"/>
  <text class="sub" x="600" y="382">the main model spends no turns polling</text>
</svg>
