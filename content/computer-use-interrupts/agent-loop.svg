<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The computer-use agent loop</title>
  <desc id="desc">A screenshot and page structure flow into reasoning, then a planned action, then mouse and keyboard input, which changes the screen and starts the loop again.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #1a1a1a; stroke-width: 2; rx: 12; }
      .label { font: 600 24px Helvetica, Arial, sans-serif; fill: #1a1a1a; text-anchor: middle; }
      .sub { font: 18px Helvetica, Arial, sans-serif; fill: #666; text-anchor: middle; }
      .line { fill: none; stroke: #1a1a1a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#fafafa"/>
  <rect class="box" x="40" y="100" width="245" height="125"/>
  <text class="label" x="162" y="150">Observe</text>
  <text class="sub" x="162" y="182">screenshot + page text</text>
  <rect class="box" x="345" y="100" width="210" height="125"/>
  <text class="label" x="450" y="150">Reason</text>
  <text class="sub" x="450" y="182">process the screen</text>
  <rect class="box" x="615" y="100" width="210" height="125"/>
  <text class="label" x="720" y="150">Plan</text>
  <text class="sub" x="720" y="182">choose an action</text>
  <rect class="box" x="885" y="100" width="275" height="125"/>
  <text class="label" x="1022" y="150">Act</text>
  <text class="sub" x="1022" y="182">mouse + keyboard</text>
  <path class="line" d="M285 162 H340"/>
  <path class="line" d="M555 162 H610"/>
  <path class="line" d="M825 162 H880"/>
  <path class="line" d="M1022 225 V292 H162 V231"/>
  <text class="sub" x="592" y="326">repeat until the task is complete</text>
</svg>
