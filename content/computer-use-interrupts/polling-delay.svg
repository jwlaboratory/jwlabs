<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Polling adds avoidable delay</title>
  <desc id="desc">The agent polls at zero, ten, and twenty seconds. The page loads at thirteen seconds, but the agent does not notice until the next poll, seven seconds later.</desc>
  <defs>
    <style>
      .label { font: 20px Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .muted { font: 18px Helvetica, Arial, sans-serif; fill: #666; }
      .strong { font: 600 22px Helvetica, Arial, sans-serif; fill: #1a1a1a; }
    </style>
  </defs>
  <rect width="1200" height="350" fill="#fafafa"/>
  <text class="strong" x="60" y="55">The page is ready before the next poll</text>
  <line x1="90" y1="178" x2="1110" y2="178" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="90" y1="158" x2="90" y2="198" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="580" y1="158" x2="580" y2="198" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="727" y1="144" x2="727" y2="212" stroke="#178a59" stroke-width="5"/>
  <line x1="1070" y1="158" x2="1070" y2="198" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="90" cy="178" r="13" fill="#1a1a1a"/>
  <circle cx="580" cy="178" r="13" fill="#1a1a1a"/>
  <circle cx="1070" cy="178" r="13" fill="#1a1a1a"/>
  <circle cx="727" cy="178" r="15" fill="#178a59"/>
  <text class="label" x="90" y="135" text-anchor="middle">poll</text>
  <text class="label" x="580" y="135" text-anchor="middle">poll</text>
  <text class="strong" x="727" y="112" text-anchor="middle" fill="#178a59">page loads</text>
  <text class="label" x="1070" y="135" text-anchor="middle">poll notices</text>
  <text class="muted" x="90" y="235" text-anchor="middle">0s</text>
  <text class="muted" x="580" y="235" text-anchor="middle">10s</text>
  <text class="muted" x="727" y="235" text-anchor="middle">13s</text>
  <text class="muted" x="1070" y="235" text-anchor="middle">20s</text>
  <path d="M727 275 H1070" stroke="#c87800" stroke-width="8" stroke-linecap="round"/>
  <path d="M727 264 L727 286 M1070 264 L1070 286" stroke="#c87800" stroke-width="4"/>
  <text class="strong" x="898" y="320" text-anchor="middle" fill="#c87800">7 seconds wasted</text>
</svg>
