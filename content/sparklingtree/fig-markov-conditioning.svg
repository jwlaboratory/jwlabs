<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="60" y="40" font-size="17" font-weight="600" fill="#1a1a1a">DSpark's Markov conditioning</text>
  <text x="60" y="62" font-size="13" fill="#666666">Draft in parallel, then run a light autoregressive head to couple the tokens</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- box 1 -->
  <rect x="60" y="120" width="170" height="90" rx="8" fill="#eef2f6" stroke="#2f6f9f" stroke-width="2"/>
  <text x="145" y="158" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Parallel draft</text>
  <text x="145" y="178" font-size="11" fill="#666666" text-anchor="middle">DFlash marginals</text>
  <text x="145" y="193" font-size="11" fill="#666666" text-anchor="middle">(independent per pos.)</text>

  <line x1="230" y1="165" x2="275" y2="165" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- box 2 -->
  <rect x="278" y="120" width="170" height="90" rx="8" fill="#f6f1ee" stroke="#c65b3c" stroke-width="2"/>
  <text x="363" y="152" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Markov head</text>
  <text x="363" y="172" font-size="11" fill="#666666" text-anchor="middle">1st-order, autoregressive</text>
  <text x="363" y="187" font-size="11" fill="#666666" text-anchor="middle">hop over positions</text>

  <line x1="448" y1="165" x2="493" y2="165" stroke="#666666" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- box 3 -->
  <rect x="496" y="120" width="170" height="90" rx="8" fill="#eef2f6" stroke="#2f6f9f" stroke-width="2"/>
  <text x="581" y="158" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Conditioned</text>
  <text x="581" y="178" font-size="11" fill="#666666" text-anchor="middle">tokens now depend</text>
  <text x="581" y="193" font-size="11" fill="#666666" text-anchor="middle">on the previous one</text>
</svg>
