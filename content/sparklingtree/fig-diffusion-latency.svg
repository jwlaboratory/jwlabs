<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="70" y="40" font-size="17" font-weight="600" fill="#1a1a1a">Block diffusion drafting (parallel)</text>
  <text x="70" y="62" font-size="13" fill="#666666">Denoising a whole block at once keeps latency roughly flat</text>
  <!-- axes -->
  <line x1="80" y1="320" x2="680" y2="320" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="90" stroke="#cccccc" stroke-width="1.5"/>
  <!-- flat line with faint dashed AR curve for contrast -->
  <path d="M80 312 C 260 306, 380 285, 470 245 S 610 130, 660 96" fill="none" stroke="#dddddd" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="612" y="120" font-size="11" fill="#bbbbbb">autoregressive</text>
  <path d="M80 232 C 250 230, 430 228, 660 224" fill="none" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="660" cy="224" r="4.5" fill="#2f6f9f"/>
  <!-- axis labels -->
  <text x="380" y="352" font-size="13" fill="#666666" text-anchor="middle">tokens drafted per step</text>
  <text x="30" y="205" font-size="13" fill="#666666" text-anchor="middle" transform="rotate(-90 30 205)">latency</text>
</svg>
